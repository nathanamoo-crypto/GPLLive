server:
  # Render (and most PaaS hosts) assign a random port at runtime via the PORT
  # env var and route external traffic to it - the app must bind to that, not
  # a fixed 8080, or the platform can't reach it. Falls back to 8080 for
  # local dev where PORT isn't set.
  port: ${PORT:8080}

spring:
  # Auto-loads application-local.yml (gitignored, holds your real local secrets)
  # so running the app in IntelliJ works with no extra setup. Override this
  # (e.g. -Dspring.profiles.active=prod, or unset it) for other environments.
  profiles:
    active: local
  application:
    name: gplFantasyLeaague
  security:
    jwt:
      secret-key: ${JWT_SECRET}
  datasource:
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fantasy_leadue}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Sends the email-verification code on registration via Brevo's HTTPS API
# (not raw SMTP - Render blocks outbound traffic on SMTP ports 25/465/587 for
# free web services, so a direct SMTP connection always times out there;
# HTTPS on 443 is unaffected). api-key comes from Brevo > SMTP & API > API
# Keys. sender-email must be a sender verified in Brevo (Senders, Domains &
# Dedicated IPs > Senders - verified via a code emailed to that address, no
# domain ownership required). Set BREVO_API_KEY/BREVO_SENDER_EMAIL as env
# vars the same way JWT_SECRET/DATABASE_URL are set (see DEPLOYMENT.md). Left
# unset, sending fails and AuthService logs it but doesn't block registration
# - the account is created but the user needs "resend code" once mail is
# configured.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:GPL Live}

# Paystack (Premium subscription payments). Test-mode keys from
# https://dashboard.paystack.com/#/settings/developer - set PAYSTACK_SECRET_KEY
# and PAYSTACK_PUBLIC_KEY as env vars the same way JWT_SECRET/DATABASE_URL
# are set (see DEPLOYMENT.md). premium-price-pesewas defaults to 100 (GH1)
# for testing - Paystack amounts are always in the currency's smallest
# subunit, so GHS 1 = 100 pesewas.
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}
  premium-price-pesewas: ${PREMIUM_PRICE_PESEWAS:100}
  premium-days: ${PREMIUM_DAYS:30}
  # Paystack redirects the checkout WebView here after payment - the
  # frontend watches for this URL to know the flow finished and closes the
  # WebView itself, so this endpoint just needs to exist, not render
  # anything meaningful. Optional - Paystack falls back to its own generic
  # success page if left blank.
  callback-url: ${PAYSTACK_CALLBACK_URL:}

# "Continue with Google" sign-in. web-client-id is the OAuth 2.0 Client ID
# (type: Web application) created in Google Cloud Console > APIs & Services >
# Credentials - it's the audience GoogleIdTokenVerifier checks the ID token
# against. Set GOOGLE_WEB_CLIENT_ID the same way JWT_SECRET/DATABASE_URL are
# set (see DEPLOYMENT.md). Left blank, Google sign-in requests fail closed
# (GoogleTokenVerifier refuses to verify anything against an empty audience)
# rather than silently accepting tokens meant for a different app.
google:
  oauth:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}

logging:
  level:
    org.flywaydb: INFO